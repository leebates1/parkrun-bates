name: Build dashboard
on:
  schedule:
    # Saturdays after parkrun results publish. GitHub frequently drops
    # scheduled runs at the top of the hour, so we fire off-the-hour
    # every 30 min across a wide window to maximise the chance one lands.
    - cron: '7,37 12-18 * * 6'
  workflow_dispatch:   # manual trigger from the Actions tab
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install curl_cffi
      - name: Build dashboard
        env:
          PARKRUN_USERNAME: ${{ secrets.PARKRUN_USERNAME }}
          PARKRUN_PASSWORD: ${{ secrets.PARKRUN_PASSWORD }}
        run: python scripts/build.py
      - name: Commit updated dashboard
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if ! git diff --staged --quiet; then
            git commit -m "chore: weekly dashboard update"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Pages rebuild
        # Bot pushes via GITHUB_TOKEN don't trigger downstream workflows,
        # so request a Pages build explicitly when we actually pushed.
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST /repos/${{ github.repository }}/pages/builds
