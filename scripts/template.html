<html lang="en">

<script>
// Runs before first paint: pick the theme from the saved preference, falling
// back to the device setting, so an explicit override never flashes light.
(function () {
  var stored = null;
  try { stored = localStorage.getItem('theme'); } catch (e) {}
  var mode = (stored === 'light' || stored === 'dark') ? stored : 'system';
  var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  window.__themeMode = mode;
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --pr-purple: #2b233d; --pr-purple2: #3d3155;
    --accent: #ffa300; --accent2: #00b6c4; --pb: #ff4d6d;
    --bg: #f5f3fb; --card: #ffffff; --ink: #1b1730; --ink2: #5c5773; --line: #e6e1ef;
    --grid: #eeeaf5;
    --head: #2b233d;          /* card headings, footer links */
    --btn-on: #2b233d;        /* active pill */
    --row-hover: #faf8ff;
    --card-border: transparent;
    --bar: #2b233d;           /* darkest chart fill — must stay legible on --card */
    /* activity heatmap ramp: no run → light → mid → strong */
    --hm0: #ece8f3; --hm1: #c3b8dc; --hm2: #7460a3; --hm3: #2b233d;
    /* runner identity as text — the chart hues (#2b233d / #ff4d6d) fail AA as
       small text, so text gets its own shades. r0 = Lee, r1 = Sally. */
    --r0-text: #4f3d80; --r1-text: #d6284b;
    /* the same, on the always-dark purple gradient cards */
    --r0-on-dark: #cfc3f7; --r1-on-dark: #ff9cae;
    /* scoreboard face for headline numbers only; body text stays system */
    --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  }
  .display { font-family:var(--font-display); font-variant-numeric:tabular-nums; letter-spacing:.3px; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #14111c; --card: #1e1a2b; --ink: #ece9f5; --ink2: #a49dbd; --line: #322c45;
      --grid: #2a2438;
      --head: #c3b8dc;
      --btn-on: #5b4a8f;
      --row-hover: #262035;
      --card-border: #2f2846;
      --bar: #9c89c4;
      --hm0: #241f33; --hm1: #4f3d80; --hm2: #9c89c4; --hm3: #ded4f5;
      --r0-text: #b9a8f0; --r1-text: #ff6b85;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); line-height:1.5; }
  header { background:linear-gradient(135deg,var(--pr-purple),var(--pr-purple2)); color:white; padding:24px 20px; box-shadow:0 2px 10px rgba(0,0,0,.12); position:relative; }
  header h1 { margin:0 0 4px; font-size:22px; font-weight:700; padding-right:100px; }
  header .meta { opacity:.85; font-size:13px; padding-right:100px; }
  header .pr-logo { position:absolute; top:20px; right:24px; width:140px; height:auto; filter:brightness(0) invert(1); opacity:.9; }
  header h1 { padding-right:160px; } header .meta { padding-right:160px; }
  @media (max-width:480px) { header .pr-logo { width:60px; top:16px; right:16px; } header h1 { padding-right:70px; } header .meta { padding-right:70px; } }
  .badge { display:inline-block; background:var(--accent); color:var(--pr-purple); padding:2px 9px; border-radius:999px; font-weight:700; font-size:11px; margin-left:6px; vertical-align:middle; }
  .runner-switcher { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .runner-switcher button { background:rgba(255,255,255,.1); color:white; border:1px solid rgba(255,255,255,.25); padding:8px 16px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:600; }
  .runner-switcher button.active { background:white; color:var(--pr-purple); border-color:white; }
  .runner-switcher .theme-btn { margin-left:auto; order:9; font-size:12px; padding:8px 14px; }
  @media (max-width:520px) {
    .runner-switcher .theme-btn { padding:8px 11px; }
    .runner-switcher .theme-btn .tl { display:none; }
  }
  .score { font-family:var(--font-display); font-size:48px; font-weight:700; line-height:1; margin:6px 0 4px; font-variant-numeric:tabular-nums; letter-spacing:.3px; }
  .score .sep { opacity:.45; margin:0 6px; font-weight:400; }
  .score-facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px;
                 margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.16); }
  .eyebrow { font-size:11px; opacity:.7; text-transform:uppercase; letter-spacing:.5px; }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  /* 3×2 below 900px, 6×1 above. auto-fit used to leave a lone card on its own
     row between ~770–920px, and stacked to 3 tall rows on phones. */
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  @media (min-width:900px) { .kpis { grid-template-columns:repeat(6,1fr); } }
  .kpi { background:var(--card); border-radius:12px; padding:14px; box-shadow:0 1px 3px rgba(30,20,60,.08); border:1px solid var(--card-border); border-top:3px solid var(--accent); }
  .kpi .label { font-size:11px; color:var(--ink2); text-transform:uppercase; letter-spacing:.5px; }
  .kpi .val { font-family:var(--font-display); font-size:30px; font-weight:700; line-height:1.05; margin-top:4px; font-variant-numeric:tabular-nums; letter-spacing:.3px; }
  .kpi .sub { font-size:11px; color:var(--ink2); margin-top:2px; }
  .kpi.pb { border-top-color:var(--pb); }
  .kpi.accent2 { border-top-color:var(--accent2); }
  @media (max-width:520px) {
    .kpis { gap:8px; }
    .kpi { padding:10px 10px 9px; border-radius:10px; }
    .kpi .label { font-size:9.5px; letter-spacing:.3px; line-height:1.25; }
    .kpi .val { font-size:24px; margin-top:3px; }
    .kpi .sub { font-size:10px; }
  }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  .card { background:var(--card); border-radius:12px; padding:14px; box-shadow:0 1px 3px rgba(30,20,60,.08); border:1px solid var(--card-border); }
  .card h2 { margin:0 0 10px; font-size:15px; color:var(--head); }
  .chart-wrap { position:relative; height:260px; }
  .chart-wrap.tall { height:320px; }
  .controls { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .btn { background:var(--bg); border:1px solid var(--line); padding:5px 10px; border-radius:999px; cursor:pointer; font-size:11px; color:var(--ink2); font-weight:600; }
  .btn.active { background:var(--btn-on); color:white; border-color:var(--btn-on); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:7px 10px; text-align:left; border-bottom:1px solid var(--line); }
  th { background:var(--bg); font-weight:600; color:var(--ink2); cursor:pointer; user-select:none; font-size:12px; }
  th:hover { color:var(--head); }
  tbody tr:hover { background:var(--row-hover); }
  .dnr { color:var(--ink2); font-style:italic; opacity:.75; }
  .pb-flag { background:var(--pb); color:white; padding:1px 7px; border-radius:4px; font-size:10px; font-weight:700; }
  .scroll { max-height:380px; overflow-y:auto; }
  footer { text-align:center; color:var(--ink2); font-size:11px; padding:18px; }
  footer a { color:var(--head); }
  /* latest-run hero */
  .hero { background:linear-gradient(135deg,#2b233d,#4f3d80); color:#fff; border-radius:12px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(30,20,60,.20); }
  .hero-top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; }
  .hero-label { font-size:11px; text-transform:uppercase; letter-spacing:.6px; opacity:.75; }
  .hero-time { font-family:var(--font-display); font-size:60px; font-weight:700; line-height:.95; margin-top:4px; font-variant-numeric:tabular-nums; letter-spacing:.5px; }
  .hero-sub { font-size:12px; opacity:.8; margin-top:4px; }
  .hero-figs { display:flex; gap:20px; }
  .hero-figs > div { text-align:right; }
  .hero-figs b { display:block; font-family:var(--font-display); font-size:30px; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums; letter-spacing:.3px; }
  .hero-figs span { font-size:10px; text-transform:uppercase; letter-spacing:.5px; opacity:.7; }
  .hero-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .chip { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:4px 10px; font-size:11.5px; font-weight:600; font-variant-numeric:tabular-nums; }
  .chip.faster { background:rgba(92,198,122,.22); border-color:rgba(92,198,122,.45); color:#bdf2cb; }
  .chip.slower { background:rgba(255,143,163,.16); border-color:rgba(255,143,163,.38); color:#ffc9d2; }
  .hero-pb { background:var(--pb); color:#fff; font-size:12px; font-weight:800; padding:3px 9px; border-radius:999px; vertical-align:middle; margin-left:8px; letter-spacing:.5px; }
  .hero-vs { margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,.16); font-size:13px; }
  /* year wrapped */
  .wrapped-banner { display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; border:0; cursor:pointer;
    text-align:left; font:inherit; background:linear-gradient(90deg,#ffa300,#ff4d6d); color:#1b1730; border-radius:12px;
    padding:12px 16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(255,77,109,.25); }
  .wrapped-banner b { font-family:var(--font-display); font-size:22px; font-weight:700; letter-spacing:.3px; }
  .wrapped-banner span { font-size:13px; font-weight:600; }
  .wrapped { position:fixed; inset:0; z-index:100; color:#fff; display:flex; flex-direction:column;
    padding:max(14px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom));
    background:radial-gradient(120% 90% at 85% 0%, #6b4aa8 0%, transparent 55%), linear-gradient(165deg,#1b1530 0%,#2b233d 45%,#3d2d66 100%); }
  .wrapped[hidden] { display:none; }   /* author display:flex would otherwise beat the UA [hidden] rule */
  .w-top { display:flex; align-items:center; gap:12px; max-width:600px; width:100%; margin:0 auto; }
  .w-bars { display:flex; gap:4px; flex:1; }
  .w-bars i { flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.22); }
  .w-bars i.on { background:#fff; }
  .w-close { background:rgba(255,255,255,.12); color:#fff; border:0; width:34px; height:34px; border-radius:50%; font-size:20px; line-height:1; cursor:pointer; }
  .w-stage { flex:1; display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; -webkit-user-select:none; padding:14px 0; }
  .w-card { max-width:600px; width:100%; }
  .w-enter { animation:wIn .35s ease both; }
  @keyframes wIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .w-enter { animation:none; } }
  .w-eyebrow { font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase; opacity:.7; }
  .w-big { font-family:var(--font-display); font-size:clamp(72px, 22vw, 136px); font-weight:700; line-height:.88; letter-spacing:.5px; }
  .w-mid { font-family:var(--font-display); font-size:clamp(36px, 10vw, 56px); font-weight:700; line-height:1; letter-spacing:.3px; }
  .w-text { font-size:16px; line-height:1.5; opacity:.92; margin-top:12px; }
  .w-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; }
  .w-tile { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:14px; padding:14px; }
  .w-tile .w-mid { font-size:clamp(30px, 8.5vw, 44px); }
  .w-name { font-size:12px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; }
  .w-sub { font-size:13px; opacity:.75; margin-top:4px; line-height:1.4; }
  .w-list { margin-top:16px; display:grid; gap:8px; }
  .w-list div { display:flex; justify-content:space-between; gap:10px; font-size:14px; padding:8px 12px; border-radius:10px; background:rgba(255,255,255,.07); }
  .w-months { display:grid; grid-template-columns:repeat(12,1fr); gap:5px; align-items:end; height:130px; margin-top:22px; }
  .w-months div { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; font-size:10px; opacity:.85; }
  .w-months b { width:100%; border-radius:4px 4px 0 0; background:rgba(255,255,255,.28); min-height:2px; }
  .w-months .peak b { background:#ffa300; }
  .w-months .future { opacity:.3; }   /* not happened yet, not a gap */
  .w-years { display:flex; gap:6px; flex-wrap:wrap; margin-top:22px; }
  .w-years button { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:6px 12px; font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
  .w-years button.on { background:#fff; color:#2b233d; }
  .w-nav { display:flex; justify-content:space-between; align-items:center; max-width:600px; width:100%; margin:0 auto; font-size:12px; opacity:.75; }
  .w-nav button { background:rgba(255,255,255,.12); color:#fff; border:0; border-radius:999px; padding:8px 14px; font:inherit; font-weight:600; cursor:pointer; }
  .w-nav button:disabled { opacity:.3; cursor:default; }
  body.w-open { overflow:hidden; }

  /* race replay */
  .replay-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .replay-head h2 { margin:0; }
  .replay-head .controls { margin:0; align-items:center; }
  .replay select.btn { padding:4px 8px; max-width:150px; }
  .lane { display:grid; grid-template-columns:50px 1fr 58px; align-items:center; gap:12px; height:36px; }
  .lane-name { font-weight:700; font-size:13px; }
  .lane-line { position:relative; height:10px; border-radius:999px; background-color:var(--bg); border:1px solid var(--line);
    background-image:repeating-linear-gradient(90deg, transparent 0 calc(20% - 1px), var(--line) calc(20% - 1px) 20%); }
  .lane-line::after { content:''; position:absolute; right:-3px; top:-7px; bottom:-7px; width:6px; border-radius:1px;
    background:conic-gradient(var(--ink) 25%, var(--card) 0 50%, var(--ink) 0 75%, var(--card) 0) 0 0 / 6px 6px; }
  .runner { position:absolute; top:50%; left:0; width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%;
    border:2px solid var(--card); box-shadow:0 1px 4px rgba(0,0,0,.3); z-index:1; }
  .lane-time { font-family:var(--font-display); font-size:22px; font-weight:700; text-align:right; font-variant-numeric:tabular-nums; }
  .lane.kms { height:16px; }
  .lane.kms .lane-line { background:none; border:0; height:14px; }
  .lane.kms .lane-line::after { display:none; }
  .lane.kms .lane-line span { position:absolute; top:0; transform:translateX(-50%); font-size:10px; color:var(--ink2); }
  .replay-foot { display:flex; align-items:center; gap:14px; margin-top:12px; flex-wrap:wrap; }
  .play { background:var(--btn-on); color:#fff; border:0; border-radius:999px; padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; }
  .replay-clock { font-size:36px; font-weight:700; line-height:1; min-width:84px; }
  .replay-status { font-size:13px; flex:1; min-width:200px; }
  .replay-note { font-size:11px; color:var(--ink2); margin-top:10px; }
  @media (max-width:480px) { .lane { grid-template-columns:42px 1fr 52px; gap:10px; } .lane-time { font-size:19px; } }

  /* season rings */
  .rings-wrap { display:grid; grid-template-columns:minmax(0,440px) 1fr; gap:24px; align-items:center; }
  @media (max-width:700px) { .rings-wrap { grid-template-columns:1fr; gap:14px; } }
  .rings { width:100%; height:auto; display:block; max-width:440px; margin:0 auto; }
  .rings circle { transition:r .15s; }
  .ring-month { font-size:12px; font-weight:600; fill:var(--ink2); }
  .ring-year { font-size:9px; font-weight:600; fill:var(--ink2); }
  .ring-total { font-family:var(--font-display); font-size:44px; font-weight:700; fill:var(--ink); }
  .ring-sub { font-size:11px; fill:var(--ink2); }
  .rings-note .fact { padding:10px 0; border-bottom:1px solid var(--line); }
  .rings-note .fact:last-of-type { border-bottom:0; }
  .rings-note .big { font-family:var(--font-display); font-size:30px; font-weight:700; line-height:1; }
  .rings-note .what { font-size:12px; color:var(--ink2); margin-top:3px; }
  .rings-legend { display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; font-size:11px; color:var(--ink2); }
  .rings-legend span { display:inline-flex; align-items:center; gap:5px; }
  .rings-legend i { width:10px; height:10px; border-radius:50%; display:inline-block; }
  @media (max-width:480px) { .hero-time { font-size:52px; } .hero-figs { gap:14px; } .hero-figs b { font-size:26px; } .score { font-size:42px; } }
</style>
</head>
<body>
<header>
  <a href="https://www.parkrun.org.uk/widnes/" target="_blank" rel="noopener" aria-label="Widnes parkrun">
    <img src="/parkrun-bates/parkrun-logo.svg" alt="parkrun" class="pr-logo">
  </a>
  <h1 id="headerName">Loading…</h1>
  <div class="meta" id="headerMeta"></div>
  <div class="runner-switcher" id="switcher"><button class="theme-btn" id="themeBtn" type="button"></button></div>
</header>

<main id="app"></main>

<footer>
  Auto-generated from <a href="https://www.parkrun.org.uk/widnes/">Widnes parkrun</a> results &middot;
  <span id="generatedAt"></span> &middot;
  <a href="https://github.com/leebates1/parkrun-bates">source</a>
</footer>

<div class="wrapped" id="wrapped" role="dialog" aria-modal="true" aria-label="Year wrapped" hidden>
  <div class="w-top"><div class="w-bars" id="wBars"></div><button class="w-close" id="wClose" type="button" aria-label="Close">×</button></div>
  <div class="w-stage" id="wStage"><div class="w-card" id="wCard"></div></div>
  <div class="w-nav"><button id="wPrev" type="button">‹ Back</button><span id="wCount"></span><button id="wNext" type="button">Next ›</button></div>
</div>

<script>
const PAYLOAD = __DATA__;
let activeRunner = 0;

Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function syncTheme() {
  Chart.defaults.color = cssVar('--ink2') || '#5c5773';
  COLORS = [cssVar('--bar') || '#2b233d', '#ff4d6d', '#00b6c4', '#ffa300'];
}

document.getElementById('generatedAt').textContent =
  'updated ' + new Date(PAYLOAD.generatedAt).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });

// helpers
function parseDate(d) { const [dd,mm,yy] = d.split('/'); return new Date(+yy, +mm-1, +dd); }
function toSeconds(t) { const p = t.split(':').map(Number); return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1]; }
function fmtTime(s) { const m = Math.floor(s/60), sec = Math.round(s%60); return m + ':' + String(sec).padStart(2,'0'); }
function fmtGap(s) { return s < 60 ? Math.round(s) + 's' : fmtTime(s); }
const fmtMonth = d => d.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
const CLUBS = [25, 50, 100, 250, 500];

// Runs per week over the 12 months to the latest run. Results only hold the
// home event, which for this family is every run.
function attendance(runner) {
  const ds = runner.results.map(r => parseDate(r.date));
  if (!ds.length) return { rate: 0, runs: 0, last: null };
  const last = new Date(Math.max(...ds)), from = new Date(last);
  from.setFullYear(from.getFullYear() - 1);
  const runs = ds.filter(d => d > from).length;
  return { rate: runs / (365 / 7), runs, last };
}
// When a milestone shirt should arrive if the last 12 months' turnout holds.
function milestoneEta(runner, n) {
  const left = n - runner.totalRuns;
  const { rate, last } = attendance(runner);
  if (left <= 0 || !rate) return null;
  return new Date(last.getTime() + (left / rate) * 7 * 86400000);
}
function fmtLong(s) { const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.round(s%60); return (h ? h+':' + String(m).padStart(2,'0') : m) + ':' + String(sec).padStart(2,'0'); }

let chartInstances = [];
function destroyCharts() { chartInstances.forEach(c => c.destroy()); chartInstances = []; stopReplay(); }

// Race replay: two dots run a 5k at even pace and cross the line in the real
// finish times. Plays once when it first scrolls into view.
let replayRaf = 0, replayObserver = null;
function stopReplay() {
  cancelAnimationFrame(replayRaf); replayRaf = 0;
  if (replayObserver) { replayObserver.disconnect(); replayObserver = null; }
}
function setupReplay(runners, days, closest, biggest) {
  const $ = id => document.getElementById(id);
  const card = document.querySelector('.replay');
  const lanes = [...card.querySelectorAll('.lane:not(.kms)')];
  const pick = $('replayPick');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const presets = { latest: days[days.length - 1], closest: closest || days[days.length - 1], biggest: biggest || days[days.length - 1] };
  const byDate = new Map(days.map(d => [d.date, d]));
  pick.innerHTML = [...days].reverse().map(d => `<option value="${d.date}">${d.date}</option>`).join('');
  const metres = m => (m < 10 ? m.toFixed(1) : Math.round(m)) + ' m';
  const who = i => `<b style="color:var(--r${i}-text)">${runners[i].short}</b>`;
  let race;

  function draw(t) {
    const T = race.runs.map(r => r.seconds), pos = T.map(x => Math.min(1, t / x));
    lanes.forEach((lane, i) => {
      lane.querySelector('.runner').style.left = (pos[i] * 100) + '%';
      lane.querySelector('.lane-time').textContent = pos[i] >= 1 ? race.runs[i].time : '';
    });
    $('replayClock').textContent = fmtTime(Math.min(t, Math.max(...T)));
    const lead = T[0] === T[1] ? -1 : T[0] < T[1] ? 0 : 1, trail = 1 - lead;
    $('replayStatus').innerHTML =
        t <= 0 ? `${race.date}: ${race.runs.map((r, i) => who(i) + ' ' + r.time).join(' vs ')}`
      : pos.every(p => p >= 1)
        ? (lead < 0 ? `🤝 Dead heat, side by side over the line in ${race.runs[0].time}`
                    : `🏁 ${who(lead)} wins by ${fmtGap(T[trail] - T[lead])}, about ${metres(5000 * (1 - T[lead] / T[trail]))}`)
      : lead >= 0 && pos[lead] >= 1 ? `${who(lead)} is home. ${runners[trail].short} has ${metres(5000 * (1 - pos[trail]))} to go`
      : lead < 0 ? 'Neck and neck…'
      : `${who(lead)} leads by ${metres(5000 * (pos[lead] - pos[trail]))} · ${(pos[lead] * 5).toFixed(1)} km gone`;
  }
  function play() {
    cancelAnimationFrame(replayRaf);
    const T = race.runs.map(r => r.seconds), tEnd = Math.max(...T), tFirst = Math.min(...T);
    if (reduce) { draw(tEnd); return; }
    const speed = tFirst / 6000;   // the leader finishes about six seconds in
    let t = 0, prev = performance.now();
    $('replayPlay').textContent = '↻ Restart';
    const step = now => {
      const dt = Math.min(now - prev, 50); prev = now;
      // photo finish: the last 3% of a close race plays at a sixth of the speed
      const slow = tEnd - tFirst < 15 && t > tFirst * 0.97;
      t = Math.min(tEnd, t + dt * speed * (slow ? 1 / 6 : 1));
      draw(t);
      if (t < tEnd) replayRaf = requestAnimationFrame(step);
      else { replayRaf = 0; $('replayPlay').textContent = '↻ Again'; }
    };
    replayRaf = requestAnimationFrame(step);
  }
  function setRace(d, autoplay) {
    race = d; pick.value = d.date;
    card.querySelectorAll('.btn[data-pick]').forEach(b => b.classList.toggle('active', presets[b.dataset.pick].date === d.date));
    cancelAnimationFrame(replayRaf); replayRaf = 0;
    $('replayPlay').textContent = '▶ Replay';
    draw(0);
    if (autoplay) play();
  }
  card.querySelectorAll('.btn[data-pick]').forEach(b => b.onclick = () => setRace(presets[b.dataset.pick], true));
  pick.onchange = () => setRace(byDate.get(pick.value), true);
  $('replayPlay').onclick = play;
  setRace(presets.latest, false);
  if ('IntersectionObserver' in window && !reduce) {
    replayObserver = new IntersectionObserver(es => {
      if (!es.some(e => e.isIntersecting)) return;
      replayObserver.disconnect(); replayObserver = null; play();
    }, { threshold: 0.6 });
    replayObserver.observe(card);
  }
}

function prep(runner) {
  return runner.results
    .map(r => ({...r, d: parseDate(r.date), seconds: toSeconds(r.time)}))
    .sort((a,b) => a.d - b.d);
}

function renderH2H() {
  destroyCharts();
  const runners = PAYLOAD.runners.map(r => ({...r, data: prep(r)}));

  const stats = runners.map(r => {
    const d = r.data;
    if (!d.length) return null;
    const pb = d.reduce((a,b) => b.seconds < a.seconds ? b : a);
    const avg = d.reduce((s,x) => s+x.seconds, 0) / d.length;
    const bestAG = d.reduce((a,b) => b.ageGrade > a.ageGrade ? b : a);
    const avgAG = d.reduce((s,x) => s+x.ageGrade, 0) / d.length;
    const bestPos = d.reduce((a,b) => b.pos < a.pos ? b : a);
    const pbs = d.filter(x => x.pb).length;
    const sub30 = d.filter(x => x.seconds < 30*60).length;
    const sub35 = d.filter(x => x.seconds < 35*60).length;
    // Fastest 3-run average
    const top3 = [...d].sort((a,b) => a.seconds - b.seconds).slice(0, 3);
    const top3avg = top3.reduce((s,x) => s+x.seconds, 0) / top3.length;
    return { ...r, pb, avg, bestAG, avgAG, bestPos, pbs, sub30, sub35, top3avg };
  }).filter(Boolean);

  // Shared race days (same date on same course)
  const byDate = {};
  runners.forEach((r, i) => r.data.forEach(x => {
    if (!byDate[x.date]) byDate[x.date] = {};
    byDate[x.date][i] = x;
  }));
  const sharedDays = Object.entries(byDate)
    .filter(([_, m]) => Object.keys(m).length === runners.length)
    .map(([date, m]) => ({ date, runs: runners.map((_, i) => m[i]), d: parseDate(date) }))
    .sort((a,b) => a.d - b.d);

  // Every event day either of them ran. The results table lists these so a
  // solo run still shows up; wins, gaps and the scatter stay on shared days,

  const allDays = Object.entries(byDate)

    .sort((a,b) => a.d - b.d);

  // Head-to-head wins (assuming 2 runners)
  let wins = [0, 0], closest = null, biggest = null;
  sharedDays.forEach(day => {
    const [a, b] = day.runs;
    if (a.seconds < b.seconds) wins[0]++;
    else if (b.seconds < a.seconds) wins[1]++;
    const gap = Math.abs(a.seconds - b.seconds);

        </tr></thead>
        <tbody>

          ${cmpRow('Widnes runs', stats.map(s => s.homeRuns), v => v, 'higher')}
          ${cmpRow('Personal best', stats.map(s => s.pb), v => fmtTime(v.seconds) + ' (' + v.date + ')')}
          ${cmpRow('Fastest 3-run avg', stats.map(s => s.top3avg), v => fmtTime(v))}
          ${cmpRow('Sub-30 runs 🚀', stats.map(s => s.sub30), v => v, 'higher')}
          ${cmpRow('Sub-35 runs', stats.map(s => s.sub35), v => v, 'higher')}

          ${cmpRow('Best finish position', stats.map(s => s.bestPos), v => '#' + v.pos)}
          ${cmpRow('PBs set', stats.map(s => s.pbs), v => v, 'higher')}
          ${(() => { const n = CLUBS.find(c => c > Math.max(...stats.map(s => s.totalRuns)));
            return n ? cmpRow(`${n} shirt due`, stats.map(s => milestoneEta(s, n)?.getTime() ?? Infinity),

        </tbody>

      </div>

    ${allDays.length ? `

          <tbody>
