function render() {
  destroyCharts();
  const runner = PAYLOAD.runners[activeRunner];
  const raw = runner.results;
  if (!raw.length) {
    document.getElementById('app').innerHTML = '<div class="card">No results yet.</div>';
    return;
  }
  const data = raw.map(r => ({...r, d: parseDate(r.date), seconds: toSeconds(r.time)})).sort((a,b)=>a.d-b.d);

  // headline
  let clubBadge = '';
  if (runner.club500) clubBadge = '<span class="badge" style="background:#000; color:white;">500 Club</span>';
  else if (runner.club250) clubBadge = '<span class="badge" style="background:#1c8a3c; color:white;">250 Club</span>';
  else if (runner.club100) clubBadge = '<span class="badge" style="background:#ff4d6d; color:white;">100 Club</span>';
  document.getElementById('headerName').innerHTML = runner.name + ' ' + clubBadge;
  document.getElementById('headerMeta').textContent =
    `parkrunner A${runner.id} · ${runner.totalRuns} parkruns total · ${runner.homeRuns} at ${runner.homeEvent}` +
    (runner.ageCat ? ` · age category ${runner.ageCat}` : '');

  // stats
  const pb = data.reduce((a,b) => b.seconds < a.seconds ? b : a);
  const avgSec = data.reduce((s,r)=>s+r.seconds,0) / data.length;
  const bestAG = data.reduce((a,b) => b.ageGrade > a.ageGrade ? b : a);
  const avgAG = data.reduce((s,r)=>s+r.ageGrade,0) / data.length;
  const bestPos = data.reduce((a,b) => b.pos < a.pos ? b : a);
  const avgPos = data.reduce((s,r)=>s+r.pos,0) / data.length;
  const pbs = data.filter(r => r.pb);

  // Latest run — the thing you open this page on a Saturday to find out.
  const latest = data[data.length-1];
  const prevRun = data.length > 1 ? data[data.length-2] : null;
  const yearBefore = new Date(latest.d); yearBefore.setFullYear(yearBefore.getFullYear()-1);
  const lastYear = data.filter(r => r !== latest && r.d >= yearBefore);
  const yearAvg = lastYear.length ? lastYear.reduce((s,r)=>s+r.seconds,0)/lastYear.length : null;
  const isPB = latest.seconds === pb.seconds;
  const daysAgo = Math.round((Date.now() - latest.d) / 86400000);
  // Same event number = same race, so this is who else in the family was there.
  const rival = PAYLOAD.runners
    .filter((_, i) => i !== activeRunner)
    .map(r => {
      const m = r.results.find(x => x.run === latest.run);
      return m ? { short: r.short, seconds: toSeconds(m.time), time: m.time } : null;
    })
    .find(Boolean);

  // Within ±10s of the comparison is noise on a 5k, so it reads as neutral
  // "on par" rather than painting a 4-second wobble red.
  const ON_PAR = 10;
  function chip(deltaSec, what) {
    if (deltaSec == null) return '';
    const v = Math.round(deltaSec);
    const signed = (v < 0 ? '−' : '+') + fmtTime(Math.abs(v));
    if (Math.abs(v) <= ON_PAR) {
      return `<span class="chip">on par with ${what}${v ? ` <span style="opacity:.7">(${signed})</span>` : ''}</span>`;
    }
    return `<span class="chip ${v < 0 ? 'faster' : 'slower'}">${signed} vs ${what}</span>`;
  }
  const wx = latest.weather;
  const wxIcon = !wx ? '' : wx.rain >= 1 ? '🌧' : wx.rain >= 0.1 ? '🌦' : wx.temp >= 20 ? '☀️' : wx.temp <= 4 ? '🥶' : '⛅';
  const heroHtml = `
    <div class="hero">
      <div class="hero-top">
        <div>
          <div class="hero-label">Latest run · ${runner.homeEvent || PAYLOAD.event} #${latest.run}</div>
          <div class="hero-time">${latest.time}${isPB ? '<span class="hero-pb">🎉 PB</span>' : ''}</div>
          <div class="hero-sub">${latest.d.toLocaleDateString('en-GB',{weekday:'long', day:'numeric', month:'long', year:'numeric'})}${daysAgo > 8 ? ' · ' + daysAgo + ' days ago' : ''}</div>
        </div>
        <div class="hero-figs">
          <div><b>${latest.pos}</b><span>position</span></div>
          <div><b>${latest.ageGrade.toFixed(1)}%</b><span>age grade</span></div>
        </div>
      </div>
      <div class="hero-chips">
        ${prevRun ? chip(latest.seconds - prevRun.seconds, 'last run') : ''}
        ${chip(yearAvg == null ? null : latest.seconds - yearAvg, '12-mo avg')}
        ${isPB ? '' : `<span class="chip">${fmtTime(latest.seconds - pb.seconds)} off PB (${pb.time})</span>`}
        ${wx ? `<span class="chip" title="Conditions 9–10am, during the run">${wxIcon} ${wx.temp}°C · ${wx.rain > 0 ? wx.rain + 'mm rain' : 'dry'} · ${Math.round(wx.wind)} km/h wind</span>` : ''}
      </div>
      ${rival ? `<div class="hero-vs">${
        latest.seconds === rival.seconds
          ? `🤝 Dead heat with ${rival.short} on ${latest.time}`
          : latest.seconds < rival.seconds
            ? `🏆 Beat ${rival.short} by ${fmtGap(rival.seconds - latest.seconds)} <span style="opacity:.7">(${rival.time})</span>`
            : `${rival.short} finished ${fmtGap(latest.seconds - rival.seconds)} ahead <span style="opacity:.7">(${rival.time})</span>`
      }</div>` : ''}
    </div>`;

  // streaks — based on consecutive event numbers, not calendar gap, since a
  // cancelled event week (no run held) advances the date but not the run number
  let longestStreak = 1, currentStreak = 1, streakStart = data[0], bestStart = data[0], bestEnd = data[0];
  for (let i=1; i<data.length; i++) {
    const consecutive = (data[i].run - data[i-1].run) === 1;
    if (consecutive) { currentStreak++; if (currentStreak > longestStreak) { longestStreak = currentStreak; bestStart = streakStart; bestEnd = data[i]; } }
    else { currentStreak = 1; streakStart = data[i]; }
  }
  let longestGap = 0, gapStart=data[0], gapEnd=data[0];
  for (let i=1; i<data.length; i++) {
    const gap = (data[i].d - data[i-1].d) / 86400000;
    if (gap > longestGap) { longestGap = gap; gapStart = data[i-1]; gapEnd = data[i]; }
  }
  let biggestDrop = 0, dropFrom=data[0], dropTo=data[0];
  for (let i=1; i<data.length; i++) {
    const drop = data[i-1].seconds - data[i].seconds;
    if (drop > biggestDrop) { biggestDrop = drop; dropFrom = data[i-1]; dropTo = data[i]; }
  }
  const last20 = data.slice(-20);
  const mean20 = last20.reduce((s,r)=>s+r.seconds,0) / last20.length;
  const sd20 = Math.sqrt(last20.reduce((s,r)=>s+(r.seconds-mean20)**2,0) / last20.length);

  const milestones = [
    { label: 'First sub-40', run: data.find(r => r.seconds < 40*60) },
    { label: 'First sub-35', run: data.find(r => r.seconds < 35*60) },
    { label: 'First sub-30', run: data.find(r => r.seconds < 30*60) },
    { label: 'First sub-25', run: data.find(r => r.seconds < 25*60) },
  ].filter(m => m.run);

  // DOM
  const app = document.getElementById('app');
  app.innerHTML = `
    ${[11, 0].includes(new Date().getMonth()) ? wrappedBanner() : ''}
    ${heroHtml}

    <div class="kpis">
      <div class="kpi pb"><div class="label">Personal Best</div><div class="val">${fmtTime(pb.seconds)}</div><div class="sub">${pb.date}</div></div>
      <div class="kpi"><div class="label">Average</div><div class="val">${fmtTime(avgSec)}</div><div class="sub">over ${data.length} runs</div></div>
      <div class="kpi accent2"><div class="label">Best age grade</div><div class="val">${bestAG.ageGrade.toFixed(2)}%</div><div class="sub">avg ${avgAG.toFixed(1)}%</div></div>
      <div class="kpi"><div class="label">Best finish</div><div class="val">${bestPos.pos}</div><div class="sub">avg ${avgPos.toFixed(0)}</div></div>
      <div class="kpi pb"><div class="label">PBs set</div><div class="val">${pbs.length}</div><div class="sub">latest ${pbs.length ? pbs[pbs.length-1].date : '—'}</div></div>
      <div class="kpi"><div class="label">Distance</div><div class="val">${(data.length*5).toLocaleString()} km</div><div class="sub">${data.length} × 5k</div></div>
    </div>

    <div class="grid"><div class="card" style="grid-column:1/-1;">
      <h2>Finish time over time</h2>
      <div id="streakRibbon" style="display:flex; align-items:center; gap:10px; padding:8px 10px; margin-bottom:10px; background:linear-gradient(90deg, rgba(255,163,0,.15), rgba(255,77,109,.15)); border-radius:8px; font-size:12px;"></div>
      <div class="controls">
        <button class="btn active" data-range="all">All</button>
        <button class="btn" data-range="2y">2 yrs</button>
        <button class="btn" data-range="1y">12 mo</button>
        <span style="flex:1;"></span>
        <button class="btn" data-mode="yoy" id="yoyBtn">Year-on-year</button>
      </div>
      <div class="chart-wrap tall"><canvas id="timeChart"></canvas></div>
    </div></div>

    <div class="grid">
      <div class="card"><h2>Best annual time</h2><div class="chart-wrap"><canvas id="yearChart"></canvas></div></div>
      <div class="card"><h2>Age grade trend</h2><div class="chart-wrap"><canvas id="ageGradeChart"></canvas></div></div>
    </div>

    <div class="grid">
      <div class="card"><h2>PB progression</h2><div class="chart-wrap"><canvas id="pbChart"></canvas></div></div>
      <div class="card"><h2>Milestones &amp; streaks</h2><div id="milestones"></div></div>
    </div>

    <div class="grid">
      <div class="card"><h2>Runs per month</h2><div class="chart-wrap"><canvas id="monthChart"></canvas></div></div>
      <div class="card"><h2>Finish time distribution</h2><div class="chart-wrap"><canvas id="histChart"></canvas></div></div>
    </div>

    <div class="grid"><div class="card" style="grid-column:1/-1;">
      <h2>Milestone shirts</h2>
      <div id="nextMilestones"></div>
    </div></div>

    <div class="grid">
      <div class="card" style="grid-column:1/-1;"><h2>Equivalent race times <span style="font-size:10px; color:var(--ink2); font-weight:normal;">(Riegel from 5k PB)</span></h2><div id="raceTimes"></div></div>
    </div>

    <div class="card" style="margin-bottom:14px;"><h2>Season rings</h2>
      <div class="rings-wrap"><div id="heatmap"></div><div id="ringsNote" class="rings-note"></div></div>
    </div>

    <div class="grid">
      <div class="card">
        <h2>Does the weather slow you down?</h2>
        <div id="weatherVerdict" style="font-size:13px; line-height:1.55; margin-bottom:10px;"></div>
        <div class="controls">
          <button class="btn active" data-wx="wind">Wind</button>
          <button class="btn" data-wx="temp">Temperature</button>
          <button class="btn" data-wx="rain">Rain</button>
        </div>
        <div class="chart-wrap"><canvas id="weatherChart"></canvas></div>
        <div id="weatherInsight" style="font-size:11px; color:var(--ink2); margin-top:6px; line-height:1.5;"></div>
      </div>
      <div class="card"><h2>Weather extremes</h2><div id="weatherExtremes"></div></div>
    </div>

    <div class="card">
      <h2>All runs</h2>
      <div class="scroll">
        <table id="runTable">
          <thead><tr>
            <th data-sort="date">Date</th>
            <th data-sort="run">Run #</th>
            <th data-sort="pos">Pos</th>
            <th data-sort="seconds">Time</th>
            <th data-sort="ageGrade">AG</th>
            <th>PB</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  `;

  wireWrappedBanner();

  // Streak ribbon
  document.getElementById('streakRibbon').innerHTML = `
    <span style="font-size:18px;">🔥</span>
    <div style="flex:1;">
      <div style="font-weight:700;">Longest streak: ${longestStreak} consecutive weeks</div>
      <div style="color:var(--ink2); font-size:11px;">${bestStart.date} → ${bestEnd.date}</div>
    </div>
    <div style="text-align:right;">
      <div style="font-weight:700;">${data.length} total runs</div>
      <div style="color:var(--ink2); font-size:11px;">${pbs.length} PBs · ${(data.length*5).toLocaleString()} km</div>
    </div>`;

  // Time chart
  let timeChart;
  const yearColors = ['#9c89c4','#7460a3','#4f3d80','#00b6c4','#ffa300','#ff4d6d','#2b233d','#5cc67a'];
  const gridColor = () => getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#eee';
  function drawTime(range) {
    const now = data[data.length-1].d;
    let filtered = data;
    if (range === '2y') filtered = data.filter(r => (now - r.d)/86400000 <= 730);
    if (range === '1y') filtered = data.filter(r => (now - r.d)/86400000 <= 365);
    const pts = filtered.map(r => ({x:r.d, y:r.seconds, pb:r.pb, date:r.date, time:r.time, ag:r.ageGrade, pos:r.pos}));
    let best = Infinity;
    const bestLine = filtered.map(r => { best = Math.min(best, r.seconds); return {x:r.d, y:best}; });
    if (timeChart) { timeChart.destroy(); chartInstances = chartInstances.filter(c => c !== timeChart); }
    timeChart = new Chart(document.getElementById('timeChart'), {
      type: 'line',
      data: { datasets: [
        { label: 'Time', data: pts, borderColor: '#7460a3',
          backgroundColor: ctx => ctx.raw && ctx.raw.pb ? '#ff4d6d' : '#ffa300',
          pointRadius: ctx => ctx.raw && ctx.raw.pb ? 6 : 3, pointHoverRadius: 7, borderWidth: 1.5, tension: 0.15 },
        { label: 'Running PB', data: bestLine, borderColor: '#ff4d6d', borderDash: [6,4], borderWidth: 2, pointRadius: 0, fill: false, stepped: 'after' }
      ]},
      options: { maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' },
          tooltip: { callbacks: { label: c => {
            const r = c.raw;
            if (!r.time) return 'PB line: ' + fmtTime(r.y);
            return [r.date, 'Time: ' + r.time + (r.pb?'  (PB)':''), 'Age grade: ' + r.ag + '%', 'Position: ' + r.pos];
          } } } },
        scales: {
          x: { type: 'time', time: { unit: 'month' }, grid: { color: () => gridColor() } },
          y: { reverse: true, ticks: { callback: v => fmtTime(v) }, grid: { color: () => gridColor() } }
        }
      }
    });
    chartInstances.push(timeChart);
  }
  function drawTimeYoY() {
    const byYear = {};
    data.forEach(r => {
      const y = r.d.getFullYear();
      const start = new Date(y, 0, 1);
      const doy = Math.floor((r.d - start) / 86400000);
      (byYear[y] = byYear[y] || []).push({ x: doy, y: r.seconds, date: r.date, time: r.time });
    });
    const datasets = Object.keys(byYear).sort().map((y, i) => ({
      label: y,
      data: byYear[y].sort((a,b)=>a.x-b.x),
      borderColor: yearColors[i % yearColors.length],
      backgroundColor: yearColors[i % yearColors.length],
      pointRadius: 2.5, pointHoverRadius: 6, borderWidth: 2, tension: 0.25, fill: false
    }));
    if (timeChart) { timeChart.destroy(); chartInstances = chartInstances.filter(c => c !== timeChart); }
    timeChart = new Chart(document.getElementById('timeChart'), {
      type: 'line',
      data: { datasets },
      options: { maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom' },
          tooltip: { callbacks: { label: c => c.dataset.label + ' · ' + c.raw.date + ' · ' + c.raw.time } } },
        scales: {
          x: { type: 'linear', min: 0, max: 366, title: { display: true, text: 'Day of year' },
               ticks: { callback: v => { const d = new Date(2024, 0, 1+v); return d.toLocaleDateString('en-GB', { month: 'short' }); }, stepSize: 30 },
               grid: { color: () => gridColor() } },
          y: { reverse: true, ticks: { callback: v => fmtTime(v) }, grid: { color: () => gridColor() } }
        }
      }
    });
    chartInstances.push(timeChart);
  }
  drawTime('all');
  document.querySelectorAll('.btn[data-range]').forEach(b => b.onclick = () => {
    document.querySelectorAll('.btn[data-range]').forEach(x => x.classList.remove('active'));
    document.getElementById('yoyBtn').classList.remove('active');
    b.classList.add('active'); drawTime(b.dataset.range);
  });
  document.getElementById('yoyBtn').onclick = () => {
    document.querySelectorAll('.btn[data-range]').forEach(x => x.classList.remove('active'));
    document.getElementById('yoyBtn').classList.add('active');
    drawTimeYoY();
  };

  // Year chart
  const byYear = {};
  data.forEach(r => { const y = r.d.getFullYear(); if (!byYear[y] || r.seconds < byYear[y].seconds) byYear[y] = r; });
  const years = Object.keys(byYear).sort();
  chartInstances.push(new Chart(document.getElementById('yearChart'), {
    type: 'bar',
    data: { labels: years, datasets: [{ label: 'Best time', data: years.map(y => byYear[y].seconds),
      backgroundColor: ['#9c89c4','#7460a3','#4f3d80',cssVar('--bar'),'#00b6c4','#ffa300','#ff4d6d'], borderRadius: 6 }] },
    options: { maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => fmtTime(c.raw) + '  (' + byYear[c.label].date + ')' } } },
      scales: { y: { ticks: { callback: v => fmtTime(v) }, grid: { color: () => getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#eee' } } }
    }
  }));

  // Age grade
  chartInstances.push(new Chart(document.getElementById('ageGradeChart'), {
    type: 'line',
    data: { datasets: [{ label: 'Age grade %', data: data.map(r => ({x:r.d, y:r.ageGrade})),
      borderColor: '#00b6c4', backgroundColor: 'rgba(0,182,196,.15)', fill: true, pointRadius: 2, tension: 0.25 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { type: 'time', time: { unit: 'month' }, grid: { color: () => getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#eee' } },
                y: { ticks: { callback: v => v + '%' }, grid: { color: () => getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#eee' } } }
    }
  }));

  // PB progression
  const pbProg = [];
  let bestSoFar = Infinity;
  data.forEach(r => { if (r.seconds < bestSoFar) { bestSoFar = r.seconds; pbProg.push(r); } });
  chartInstances.push(new Chart(document.getElementById('pbChart'), {
    type: 'line',
    data: { datasets: [{ label: 'PB', data: pbProg.map(r => ({x:r.d, y:r.seconds, date:r.date, time:r.time})),
      borderColor: '#ff4d6d', backgroundColor: '#ff4d6d', pointRadius: 6, pointHoverRadius: 8, stepped: 'after', borderWidth: 2 }] },
    options: { maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => c.raw.date + ' → ' + c.raw.time } } },
      scales: { x: { type: 'time', time: { unit: 'month' }, grid: { color: () => getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#eee' } },
                y: { reverse: true, ticks: { callback: v => fmtTime(v) }, grid: { color: () => getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#eee' } } }
    }
  }));

  // Milestones
  document.getElementById('milestones').innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:12px;">
      ${milestones.map(m => `<div style="background:var(--bg); padding:9px; border-radius:8px;">
        <div style="color:var(--ink2); font-size:10px; text-transform:uppercase; letter-spacing:.5px;">${m.label}</div>
        <div style="font-weight:700; margin-top:2px;">${m.run.time}</div>
        <div style="font-size:11px; color:var(--ink2);">${m.run.date}</div>
      </div>`).join('')}
      <div style="background:var(--bg); padding:9px; border-radius:8px;">
        <div style="color:var(--ink2); font-size:10px; text-transform:uppercase; letter-spacing:.5px;">Longest streak</div>
        <div style="font-weight:700; margin-top:2px;">${longestStreak} weeks</div>
        <div style="font-size:11px; color:var(--ink2);">${bestStart.date} → ${bestEnd.date}</div>
      </div>
      <div style="background:var(--bg); padding:9px; border-radius:8px;">
        <div style="color:var(--ink2); font-size:10px; text-transform:uppercase; letter-spacing:.5px;">Biggest improvement</div>
        <div style="font-weight:700; margin-top:2px;">${fmtTime(biggestDrop)} faster</div>
        <div style="font-size:11px; color:var(--ink2);">${dropFrom.time} → ${dropTo.time}</div>
      </div>
      <div style="background:var(--bg); padding:9px; border-radius:8px;">
        <div style="color:var(--ink2); font-size:10px; text-transform:uppercase; letter-spacing:.5px;">Longest gap</div>
        <div style="font-weight:700; margin-top:2px;">${Math.round(longestGap)} days</div>
      </div>
      <div style="background:var(--bg); padding:9px; border-radius:8px;">
        <div style="color:var(--ink2); font-size:10px; text-transform:uppercase; letter-spacing:.5px;">Consistency (last 20)</div>
        <div style="font-weight:700; margin-top:2px;">±${fmtTime(sd20)}</div>
        <div style="font-size:11px; color:var(--ink2);">std dev from ${fmtTime(mean20)}</div>
      </div>
    </div>`;

  // Month activity
  const byMonth = {};
  data.forEach(r => { const k = r.d.getFullYear() + '-' + String(r.d.getMonth()+1).padStart(2,'0'); byMonth[k] = (byMonth[k]||0)+1; });
  const mKeys = Object.keys(byMonth).sort();
  chartInstances.push(new Chart(document.getElementById('monthChart'), {
    type: 'bar',
    data: { labels: mKeys, datasets: [{ label: 'Runs', data: mKeys.map(k => byMonth[k]), backgroundColor: '#ffa300', borderRadius: 3 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { maxRotation: 90, minRotation: 60, font: { size: 9 } }, grid: { display: false } },
                y: { beginAtZero: true, ticks: { stepSize: 1 }, grid: { color: () => getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#eee' } } }
    }
  }));

  // Histogram
  const bins = {};
  data.forEach(r => { const b = Math.floor(r.seconds/60)*60; bins[b] = (bins[b]||0)+1; });
  const bKeys = Object.keys(bins).map(Number).sort((a,b)=>a-b);
  chartInstances.push(new Chart(document.getElementById('histChart'), {
    type: 'bar',
    data: { labels: bKeys.map(b => fmtTime(b)+'–'+fmtTime(b+60)), datasets: [{ label:'Runs', data: bKeys.map(b=>bins[b]), backgroundColor: cssVar('--bar'), borderRadius: 3 }] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false } },
      scales: { x: { ticks: { maxRotation: 60, minRotation: 45, font: { size: 10 } }, grid: { display: false } },
                y: { beginAtZero: true, ticks: { stepSize: 2 }, grid: { color: () => getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || '#eee' } } }
    }
  }));

  // Race times
  const distances = [
    { name: '1 mile', km: 1.609, emoji: '⚡' },
    { name: '5 km (PB)', km: 5, emoji: '🏁' },
    { name: '10 km', km: 10, emoji: '🏃' },
    { name: 'Half marathon', km: 21.0975, emoji: '🥈' },
    { name: 'Marathon', km: 42.195, emoji: '🥇' },
  ];
  document.getElementById('raceTimes').innerHTML = `<table style="width:100%; font-size:12px;">
    ${distances.map(d => { const t = pb.seconds * Math.pow(d.km/5, 1.06); return `<tr>
      <td style="padding:7px 0;">${d.emoji} ${d.name}</td>
      <td style="text-align:right; font-weight:700; font-variant-numeric:tabular-nums;">${fmtLong(t)}</td>
      <td style="text-align:right; color:var(--ink2); font-size:11px; font-variant-numeric:tabular-nums;">${fmtTime(t/d.km)}/km</td>
    </tr>`; }).join('')}
  </table><div style="font-size:11px; color:var(--ink2); margin-top:6px;">From 5 km PB of ${pb.time}.</div>`;

  // Next milestones
  const SHIRTS = __SHIRTS__;
  const clubs = [
    { n: 25,  color: '#7b4f9e' },
    { n: 50,  color: '#d7282f' },
    { n: 100, color: '#1a1a1a' },
    { n: 250, color: '#1b5e3f' },
    { n: 500, color: '#1e5ba8' },
  ];
  const shirtImg = (n, achieved) => `<img src="${SHIRTS[n]||''}" alt="${n} shirt" style="width:100%; height:auto; display:block; filter:${achieved?'none':'grayscale(100%) opacity(0.45)'};">`;
  document.getElementById('nextMilestones').innerHTML = `
    <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:14px; font-size:13px; align-items:start;">
      ${clubs.map(m => {
        const pct = Math.min(100, (runner.totalRuns/m.n)*100);
        const rem = m.n - runner.totalRuns;
        const achieved = rem <= 0;
        return `<div style="display:flex; flex-direction:column; align-items:center; text-align:center;">
          <div style="width:100%; aspect-ratio:220/451; display:flex; align-items:center; justify-content:center;">
            <img src="${SHIRTS[m.n]||''}" alt="${m.n} shirt" style="max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; display:block; filter:${achieved?'none':'grayscale(100%) opacity(0.45)'};">
          </div>
          <div style="font-size:10px; color:var(--ink2); text-transform:uppercase; letter-spacing:.5px; margin-top:8px; min-height:14px;">${m.n} club</div>
          <div style="font-weight:800; margin-top:2px; font-size:13px; min-height:18px;">${achieved ? '✅ earned' : rem + ' to go'}</div>
          <div style="font-size:11px; color:var(--ink2); min-height:16px;">${achieved ? '' : (() => { const eta = milestoneEta(runner, m.n); return eta ? 'around ' + fmtMonth(eta) : ''; })()}</div>
          <div style="background:var(--bg); border-radius:999px; height:7px; overflow:hidden; margin-top:6px; width:100%;">
            <div style="background:${achieved?m.color:'#ffa300'}; height:100%; width:${pct}%;"></div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="font-size:11px; color:var(--ink2); margin-top:10px;">Dates assume you keep turning up like the last 12 months (${attendance(runner).runs} runs).</div>`;

  // Season rings: one ring per year (oldest innermost), one dot per Saturday,
  // clockwise from January at the top. A year loops, so this shows what a
  // strip can't: the summer gaps, when PBs cluster, the rings brightening as
  // fitness came. A small wedge at 12 o'clock is left empty for year labels.
  {
    const first = data[0], last = data[data.length - 1];
    const years = [];
    for (let y = first.d.getFullYear(); y <= last.d.getFullYear(); y++) years.push(y);
    const S = 440, C = S / 2, R_IN = 60, R_OUT = 192, GAP = 0.045;
    const ringW = (R_OUT - R_IN) / years.length;
    // colour by this runner's own age-grade thirds, so everyone gets the full range
    const ags = data.map(r => r.ageGrade).sort((a, b) => a - b);
    const t1 = ags[Math.floor(ags.length / 3)], t2 = ags[Math.floor(2 * ags.length / 3)];
    const tier = r => r.pb ? 'var(--pb)' : r.ageGrade >= t2 ? 'var(--hm3)' : r.ageGrade >= t1 ? 'var(--hm2)' : 'var(--hm1)';
    const angle = d => {
      const y0 = new Date(d.getFullYear(), 0, 1), y1 = new Date(d.getFullYear() + 1, 0, 1);
      return -Math.PI / 2 + Math.PI * GAP + ((d - y0) / (y1 - y0)) * 2 * Math.PI * (1 - GAP);
    };
    const pt = (a, r) => [(C + r * Math.cos(a)).toFixed(1), (C + r * Math.sin(a)).toFixed(1)];
    const byDay = new Map(data.map(r => [r.d.toDateString(), r]));
    const saturdays = [];   // every Saturday from the first run to the latest
    for (const d = new Date(first.d); d <= last.d; d.setDate(d.getDate() + 1)) if (d.getDay() === 6) saturdays.push(new Date(d));

    let svg = `<svg viewBox="0 0 ${S} ${S}" class="rings" role="img" aria-label="${data.length} parkruns by week, one ring per year">`;
    for (let m = 0; m < 12; m++) {
      const [x1, y1] = pt(angle(new Date(2025, m, 1)), R_IN - 6), [x2, y2] = pt(angle(new Date(2025, m, 1)), R_OUT + 6);
      svg += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:var(--grid)" stroke-width="1"/>`;
      const [lx, ly] = pt(angle(new Date(2025, m, 16)), R_OUT + 17);
      svg += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" class="ring-month">${'JFMAMJJASOND'[m]}</text>`;
    }
    years.forEach((y, k) => {
      const r = R_IN + ringW * (k + 0.5);
      const dotR = Math.max(1.8, Math.min(ringW * 0.36, (2 * Math.PI * r / 52.2) * 0.4, 6.5));
      // each year sits in its own lane, like a running track
      svg += `<circle cx="${C}" cy="${C}" r="${r.toFixed(1)}" fill="none" style="stroke:var(--grid)" stroke-width="${(ringW * 0.78).toFixed(1)}" opacity=".55"/>`;
      const days = saturdays.filter(d => d.getFullYear() === y)
        .concat(data.filter(x => x.d.getFullYear() === y && x.d.getDay() !== 6).map(x => x.d));   // Christmas / New Year's Day
      for (const day of days) {
        const run = byDay.get(day.toDateString());
        const [x, yy] = pt(angle(day), r);
        const title = run ? `${run.date}: ${run.time} · ${run.ageGrade}%${run.pb ? ' · PB' : ''}` : `${day.toLocaleDateString('en-GB')}: no run`;
        svg += `<circle cx="${x}" cy="${yy}" r="${(run ? dotR : dotR * 0.5).toFixed(2)}" style="fill:${run ? tier(run) : 'var(--hm0)'}"><title>${title}</title></circle>`;
      }
      const [tx, ty] = pt(-Math.PI / 2, r);
      svg += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" class="ring-year">’${String(y).slice(2)}</text>`;
    });
    const [hx, hy] = pt(angle(last.d), R_IN + ringW * (years.length - 0.5));
    svg += `<circle cx="${hx}" cy="${hy}" r="${Math.min(ringW * 0.36, 6.5) + 3.5}" fill="none" style="stroke:var(--ink)" stroke-width="1.5"><title>Latest: ${last.date}</title></circle>`;
    svg += `<text x="${C}" y="${C - 7}" text-anchor="middle" dominant-baseline="central" class="ring-total">${data.length}</text>`;
    svg += `<text x="${C}" y="${C + 19}" text-anchor="middle" dominant-baseline="central" class="ring-sub">parkruns</text></svg>`;
    document.getElementById('heatmap').innerHTML = svg;

    // Facts the rings make visible. Event numbers only advance when an event is
    // held, so last − first + 1 is exactly how many happened in your span.
    const held = last.run - first.run + 1;
    const sat = Array(12).fill(0), ran = Array(12).fill(0), pbm = Array(12).fill(0);
    saturdays.forEach(d => sat[d.getMonth()]++);
    data.forEach(r => { if (r.d.getDay() === 6) ran[r.d.getMonth()]++; if (r.pb) pbm[r.d.getMonth()]++; });
    const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const missShare = sat.map((n, m) => n >= 4 ? (n - ran[m]) / n : -1);
    const worst = missShare.indexOf(Math.max(...missShare));
    const pbTop = Math.max(...pbm), pbMonths = pbm.map((n, m) => n === pbTop ? MONTHS[m] : null).filter(Boolean);
    const totalPbs = pbm.reduce((a, b) => a + b, 0);
    document.getElementById('ringsNote').innerHTML = `
      <div class="fact"><div class="big">${Math.round(100 * data.length / held)}%</div>
        <div class="what">of Widnes parkruns since your first: ${data.length} of the ${held} held</div></div>
      ${missShare[worst] > 0 ? `<div class="fact"><div class="big">${MONTHS[worst]}</div>
        <div class="what">is when you miss most: ${sat[worst] - ran[worst]} of ${sat[worst]} Saturdays</div></div>` : ''}
      ${totalPbs ? `<div class="fact"><div class="big">${pbMonths.slice(0, 2).join(' & ')}</div>
        <div class="what">${pbMonths.length > 1 ? 'are' : 'is'} PB season: ${pbTop} of your ${totalPbs} PBs ${pbMonths.length > 1 ? 'each' : ''}</div></div>` : ''}
      <div class="rings-legend">
        <span><i style="background:var(--hm0)"></i>missed</span>
        <span><i style="background:var(--hm1)"></i>your slower third</span>
        <span><i style="background:var(--hm2)"></i>middle</span>
        <span><i style="background:var(--hm3)"></i>quicker third</span>
        <span><i style="background:var(--pb)"></i>PB</span>
      </div>`;
  }

  // Weather. A raw correlation between weather and finish time mostly
  // measures fitness: the slow beginner months happened to be windier, so wind
  // "correlated" with time. Instead, compare each run with the runner's form
  // at the time (median of the 8 runs around it) and ask whether weather
  // explains what's left, with a bootstrap range so noise isn't sold as signal.
  const wData = data.filter(r => r.weather);
  if (wData.length >= 20) {
    const median = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; };
    const mean = a => a.reduce((t, v) => t + v, 0) / a.length;
    const FORM_K = 4;
    const vsForm = data.map((r, i) => {
      const nb = data.slice(Math.max(0, i - FORM_K), i).concat(data.slice(i + 1, i + 1 + FORM_K)).map(x => x.seconds);
      return r.seconds - median(nb);
    });
    const centre = median(vsForm);
    const spread = 1.4826 * median(vsForm.map(e => Math.abs(e - centre)));   // robust SD
    const usable = data.map((r, i) => ({ r, e: vsForm[i] }))
      .filter(u => u.r.weather && Math.abs(u.e - centre) <= 4 * spread);   // drop one-off runs, e.g. walking with someone
    const dropped = wData.length - usable.length;

    // Seeded, so the verdict doesn't change between page loads.
    const rng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const slope = (xs, ys) => { const mx = mean(xs), my = mean(ys); let n = 0, d = 0;
      for (let i = 0; i < xs.length; i++) { n += (xs[i] - mx) * (ys[i] - my); d += (xs[i] - mx) ** 2; } return d ? n / d : 0; };
    const FX = {
      wind: { label: 'Wind', x: w => w.wind, per: 10, axis: 'Wind during the run (km/h)',
              unit: 'per extra 10 km/h', phrase: 'every extra 10 km/h of wind' },
      temp: { label: 'Temperature', x: w => w.temp, per: 5, axis: 'Temperature at the start (°C)',
              unit: 'per 5°C warmer', phrase: 'every 5°C warmer' },
      // mostly dry runs, so compare wet with dry rather than fit a slope per mm
      rain: { label: 'Rain', x: w => w.rain >= 0.2 ? 1 : 0, plotX: w => w.rain, per: 1, axis: 'Rain during the run (mm)',
              unit: 'wet vs dry', phrase: 'running in the rain' },
    };
    for (const [key, f] of Object.entries(FX)) {
      const xs = usable.map(u => f.x(u.r.weather)), ys = usable.map(u => u.e);
      f.n = key === 'rain' ? xs.filter(Boolean).length : xs.length;
      f.est = slope(xs, ys) * f.per;
      const rand = rng(529), boots = [];
      for (let b = 0; b < 1000; b++) {
        const bx = [], by = [];
        for (let i = 0; i < xs.length; i++) { const j = Math.floor(rand() * xs.length); bx.push(xs[j]); by.push(ys[j]); }
        boots.push(slope(bx, by) * f.per);
      }
      boots.sort((a, b) => a - b);
      [f.lo, f.hi] = [boots[5], boots[994]];   // 99%: three things are tested, so be strict
      f.enough = f.n >= 8;
      f.clear = f.enough && (f.lo > 0 || f.hi < 0);
    }

    const sgn = v => (v < 0 ? '−' : '+') + fmtGap(Math.abs(Math.round(v)));
    const clear = Object.values(FX).filter(f => f.clear);
    const verdict = !clear.length
      ? `<b>Not measurably.</b> Allowing for your form at the time, wind, temperature and rain make no difference we can detect.
         Your times naturally swing by about <b>${fmtGap(Math.round(spread))}</b> either side of your form from week to week,
         so the weather would need a big effect to show up, and nothing does.`
      : `<b>${clear.map(f => f.label).join(' and ')} ${clear.length > 1 ? 'do' : 'does'}.</b> Allowing for your form at the time, ` +
        clear.map(f => `${f.phrase} ${f.est > 0 ? 'costs' : 'saves'} you about <b>${fmtGap(Math.abs(Math.round(f.est)))}</b>
          (somewhere between ${fmtGap(Math.abs(Math.round(f.est > 0 ? f.lo : f.hi)))} and ${fmtGap(Math.abs(Math.round(f.est > 0 ? f.hi : f.lo)))})`).join('; ') +
        `. ${Object.values(FX).filter(f => !f.clear).map(f => f.label.toLowerCase()).join(' and ') || 'nothing else'} make no difference we can detect.`;
    document.getElementById('weatherVerdict').innerHTML = verdict;

    let wxChart;
    function drawWx(key) {
      const f = FX[key], px = f.plotX || f.x;
      const pts = usable.map(u => ({ x: px(u.r.weather), y: u.e, date: u.r.date, time: u.r.time, pb: u.r.pb, w: u.r.weather }));
      const xs = pts.map(p => p.x), x0 = Math.min(...xs), x1 = Math.max(...xs);
      if (wxChart) { wxChart.destroy(); chartInstances = chartInstances.filter(c => c !== wxChart); }
      wxChart = new Chart(document.getElementById('weatherChart'), {
        type: 'scatter',
        data: { datasets: [
          { label: 'Run', data: pts, backgroundColor: ctx => ctx.raw && ctx.raw.pb ? '#ff4d6d' : '#00b6c4',
            pointRadius: ctx => ctx.raw && ctx.raw.pb ? 6 : 4, pointHoverRadius: 7 },
          { label: 'Your form', type: 'line', data: [{ x: x0, y: 0 }, { x: x1, y: 0 }], borderColor: cssVar('--ink2'),
            borderDash: [5, 4], borderWidth: 1, pointRadius: 0 },
        ] },
        options: { maintainAspectRatio: false,
          plugins: { legend: { display: false },
            tooltip: { filter: c => c.datasetIndex === 0, callbacks: { label: c => { const r = c.raw;
              return [r.date + '  ' + r.time + (r.pb ? ' (PB)' : ''), sgn(r.y) + ' vs your form',
                      r.w.temp + '°C · ' + (r.w.rain > 0 ? r.w.rain + 'mm rain' : 'dry') + ' · ' + Math.round(r.w.wind) + ' km/h wind']; } } } },
          scales: {
            x: { title: { display: true, text: f.axis }, grid: { color: () => gridColor() } },
            y: { reverse: true, title: { display: true, text: 'vs your form · faster ↑' },
                 ticks: { callback: v => v === 0 ? '0' : sgn(v) }, grid: { color: () => gridColor() } }
          }
        }
      });
      chartInstances.push(wxChart);
      document.getElementById('weatherInsight').innerHTML =
        (f.enough
          ? `<b>${f.label}:</b> ${f.clear ? 'a clear effect' : 'no clear effect'}, somewhere between ${sgn(f.lo)} and ${sgn(f.hi)} ${f.unit}.`
          : `<b>${f.label}:</b> only ${f.n} runs to go on, too few to tell.`) +
        ` Each dot is a run against the median of the 8 runs around it, so getting fitter doesn't look like weather.
          Weather is for 9–10am, while you were running.${dropped ? ` ${dropped} one-off run${dropped === 1 ? '' : 's'} far from your usual form left out.` : ''}`;
    }
    drawWx('wind');
    document.querySelectorAll('.btn[data-wx]').forEach(b => b.onclick = () => {
      document.querySelectorAll('.btn[data-wx]').forEach(x => x.classList.toggle('active', x === b));
      drawWx(b.dataset.wx);
    });

    const byTemp = [...wData].sort((a,b) => a.weather.temp - b.weather.temp);
    const rainy = [...wData].sort((a,b) => b.weather.rain - a.weather.rain)[0];
    const windy = [...wData].sort((a,b) => b.weather.wind - a.weather.wind)[0];
    function wCard(label, r, detail) {
      return `<div style="background:var(--bg); padding:9px; border-radius:8px; margin-bottom:6px;">
        <div style="color:var(--ink2); font-size:10px; text-transform:uppercase; letter-spacing:.5px;">${label}</div>
        <div style="font-weight:700; margin-top:2px;">${detail}</div>
        <div style="font-size:11px; color:var(--ink2);">${r.date} &middot; ${r.time} &middot; AG ${r.ageGrade}%</div>
      </div>`;
    }
    document.getElementById('weatherExtremes').innerHTML =
      wCard('🥶 Coldest start', byTemp[0], byTemp[0].weather.temp + '°C') +
      wCard('🥵 Warmest start', byTemp[byTemp.length-1], byTemp[byTemp.length-1].weather.temp + '°C') +
      (rainy.weather.rain > 0 ? wCard('🌧 Wettest run', rainy, rainy.weather.rain + 'mm while running') : '') +
      wCard('💨 Windiest run', windy, Math.round(windy.weather.wind) + ' km/h, gusting ' + Math.round(windy.weather.gust));
  } else {
    document.getElementById('weatherChart').parentElement.parentElement.style.display = 'none';
    document.getElementById('weatherExtremes').parentElement.style.display = 'none';
  }

  // Table
  const tbody = document.querySelector('#runTable tbody');
  let sortKey = 'date', sortDir = -1;
  function renderTable() {
    const sorted = [...data].sort((a,b) => {
      let av=a[sortKey], bv=b[sortKey];
      if (sortKey==='date') { av=a.d; bv=b.d; }
      return av > bv ? sortDir : av < bv ? -sortDir : 0;
    });
    tbody.innerHTML = sorted.map(r => `<tr>
      <td>${r.date}</td><td>${r.run}</td><td>${r.pos}</td><td>${r.time}</td>
      <td>${r.ageGrade.toFixed(2)}%</td><td>${r.pb?'<span class="pb-flag">PB</span>':''}</td>
    </tr>`).join('');
  }
  renderTable();
  document.querySelectorAll('#runTable th[data-sort]').forEach(th => {
    th.onclick = () => { const k = th.dataset.sort; if (k===sortKey) sortDir*=-1; else { sortKey=k; sortDir=-1; } renderTable(); };
  });
}

// Year wrapped: a family story for one year, card by card. Shows "so far"
// until December; in January it defaults to the year just finished.
const W = { year: null, i: 0, slides: [] };
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function wrappedYears() {
  const ys = new Set(PAYLOAD.runners.flatMap(r => r.results.map(x => parseDate(x.date).getFullYear())));
  return [...ys].sort((a, b) => a - b);
}
function defaultWrappedYear() {
  const ys = wrappedYears(), now = new Date();
  const y = now.getMonth() === 0 ? now.getFullYear() - 1 : now.getFullYear();
  return ys.includes(y) ? y : ys[ys.length - 1];
}
function wrappedBanner() {
  const y = defaultWrappedYear(), done = y < new Date().getFullYear() || new Date().getMonth() === 11;
  return `<button class="wrapped-banner" type="button" data-wrapped><b>✨ ${y} wrapped</b><span>${done ? 'Your year' : 'Your year so far'} in cards ›</span></button>`;
}
function wireWrappedBanner() {
  document.querySelectorAll('[data-wrapped]').forEach(b => b.onclick = () => openWrapped(defaultWrappedYear(), b));
}

function yearStats(Y) {
  const people = PAYLOAD.runners.map((r, i) => {
    const all = prep(r), yr = all.filter(x => x.d.getFullYear() === Y);
    const before = all.filter(x => x.d.getFullYear() < Y);
    const after = all.filter(x => x.d.getFullYear() > Y).length;
    const fastest = yr.length ? yr.reduce((a, b) => b.seconds < a.seconds ? b : a) : null;
    const bestBefore = before.length ? Math.min(...before.map(x => x.seconds)) : null;
    let streak = yr.length ? 1 : 0, cur = 1;
    for (let k = 1; k < yr.length; k++) { cur = yr[k].run - yr[k-1].run === 1 ? cur + 1 : 1; streak = Math.max(streak, cur); }
    const endTotal = r.totalRuns - after, startTotal = endTotal - yr.length;
    return { i, short: r.short, runner: r, yr, fastest, bestBefore, pbs: yr.filter(x => x.pb), streak,
             crossed: CLUBS.filter(c => startTotal < c && endTotal >= c), endTotal };
  });
  const byDate = {};
  people.forEach(p => p.yr.forEach(x => { (byDate[x.date] = byDate[x.date] || { d: x.d, runs: {} }).runs[p.i] = x; }));
  const days = Object.entries(byDate).map(([date, v]) => ({ date, ...v })).sort((a, b) => a.d - b.d);
  const shared = days.filter(d => people.every(p => d.runs[p.i]));
  const wins = people.map(() => 0); let closest = null;
  shared.forEach(d => {
    const [a, b] = [d.runs[0], d.runs[1]], gap = Math.abs(a.seconds - b.seconds);
    if (a.seconds < b.seconds) wins[0]++; else if (b.seconds < a.seconds) wins[1]++;
    if (gap > 0 && (!closest || gap < closest.gap)) closest = { ...d, gap };
  });
  const months = Array(12).fill(0);
  days.forEach(d => months[d.d.getMonth()] += Object.keys(d.runs).length);
  const wx = days.map(d => ({ ...d, w: Object.values(d.runs)[0].weather })).filter(d => d.w);
  return { Y, people, days, shared, wins, ties: shared.length - wins[0] - wins[1], closest, months, wx,
           runs: people.reduce((t, p) => t + p.yr.length, 0) };
}

function buildSlides(st) {
  const P = st.people, names = P.map(p => p.short).join(' & ');
  const who = p => `<span class="w-name" style="color:var(--r${p.i}-on-dark)">${p.short}</span>`;
  const soFar = st.Y === new Date().getFullYear() && new Date().getMonth() < 11;
  const out = [];
  out.push(`<div class="w-eyebrow">${names}</div>
    <div class="w-big">${st.Y}</div><div class="w-mid" style="opacity:.85">wrapped${soFar ? ' so far' : ''}</div>
    <div class="w-text">${st.runs} parkruns between you${st.shared.length ? `, ${st.shared.length} of them side by side` : ''}.</div>
    <div class="w-years">${wrappedYears().map(y => `<button type="button" data-year="${y}" class="${y === st.Y ? 'on' : ''}">${y}</button>`).join('')}</div>`);
  if (!st.runs) return out;

  const top = [...P].sort((a, b) => b.yr.length - a.yr.length);
  out.push(`<div class="w-eyebrow">Turning up</div>
    <div class="w-big">${st.runs * 5}<span style="font-size:.4em"> km</span></div>
    <div class="w-text">${st.runs} parkruns between you, across ${st.days.length} Saturday mornings in Widnes.${top[0].yr.length !== top[1].yr.length ? ` ${top[0].short} made it to ${top[0].yr.length - top[1].yr.length} more.` : ' Exactly level.'}</div>
    <div class="w-row">${P.map(p => `<div class="w-tile">${who(p)}<div class="w-mid">${p.yr.length}</div><div class="w-sub">parkruns</div></div>`).join('')}</div>`);

  out.push(`<div class="w-eyebrow">Fastest of the year</div>
    <div class="w-row">${P.map(p => `<div class="w-tile">${who(p)}<div class="w-mid">${p.fastest ? p.fastest.time : '—'}</div>
      <div class="w-sub">${p.fastest ? p.fastest.date + (p.bestBefore == null ? '' : p.fastest.seconds < p.bestBefore
        ? ` · ${fmtGap(p.bestBefore - p.fastest.seconds)} quicker than ever before` : ` · best ever still ${fmtTime(p.bestBefore)}`) : 'no runs'}</div></div>`).join('')}</div>`);

  const pbCount = P.reduce((t, p) => t + p.pbs.length, 0);
  // a list for a handful; a big year (2023 had 16) gets one tile each instead
  out.push(pbCount > 6
    ? `<div class="w-eyebrow">New PBs</div><div class="w-big">${pbCount}</div>
       <div class="w-row">${P.map(p => `<div class="w-tile">${who(p)}<div class="w-mid">${p.pbs.length}</div>
         <div class="w-sub">${p.pbs.length ? `down to ${p.pbs[p.pbs.length - 1].time} by ${p.pbs[p.pbs.length - 1].date}` : 'none this year'}</div></div>`).join('')}</div>`
    : pbCount
    ? `<div class="w-eyebrow">New PBs</div><div class="w-big">${pbCount}</div>
       <div class="w-list">${P.flatMap(p => p.pbs.map(x => `<div>${who(p)}<span>${x.date}</span><b class="display" style="font-size:18px">${x.time}</b></div>`)).join('')}</div>`
    : `<div class="w-eyebrow">New PBs</div><div class="w-mid">None this year</div>
       <div class="w-text">The bests still standing: ${P.map(p => `${p.short} ${p.bestBefore != null ? fmtTime(p.bestBefore) : '—'}`).join(', ')}. Next year.</div>`);

  if (st.shared.length) {
    const lead = st.wins[0] === st.wins[1] ? null : st.wins[0] > st.wins[1] ? P[0] : P[1];
    out.push(`<div class="w-eyebrow">Head to head</div>
      <div class="w-big"><span style="color:var(--r0-on-dark)">${st.wins[0]}</span><span style="opacity:.4">–</span><span style="color:var(--r1-on-dark)">${st.wins[1]}</span></div>
      <div class="w-text">${lead ? `${lead.short} took the year` : 'Honours even'}${st.ties ? `, with ${st.ties} dead heat${st.ties === 1 ? '' : 's'}` : ''}.
        ${st.closest ? `Closest: ${fmtGap(st.closest.gap)} on ${st.closest.date}.` : ''}</div>`);
  }

  out.push(`<div class="w-eyebrow">Longest streak</div>
    <div class="w-row">${P.map(p => `<div class="w-tile">${who(p)}<div class="w-mid">${p.streak}</div><div class="w-sub">parkruns in a row</div></div>`).join('')}</div>
    <div class="w-text">Counted in event numbers, so a cancelled week doesn't break it.</div>`);

  const peak = Math.max(...st.months), pm = st.months.indexOf(peak);
  out.push(`<div class="w-eyebrow">Busiest month</div><div class="w-mid">${MONTH_NAMES[pm]}</div>
    <div class="w-text">${peak} runs between you.</div>
    <div class="w-months">${st.months.map((n, m) => `<div class="${m === pm ? 'peak' : ''}${soFar && m > new Date().getMonth() ? ' future' : ''}"><b style="height:${peak ? (n / peak) * 100 : 0}%"></b>${'JFMAMJJASOND'[m]}</div>`).join('')}</div>`);

  if (st.wx.length) {
    const wet = [...st.wx].sort((a, b) => b.w.rain - a.w.rain)[0];
    const cold = [...st.wx].sort((a, b) => a.w.temp - b.w.temp)[0];
    const windy = [...st.wx].sort((a, b) => b.w.wind - a.w.wind)[0];
    const ran = d => P.filter(p => d.runs[p.i]).map(p => p.short).join(' & ');
    out.push(`<div class="w-eyebrow">Weathering it</div>
      <div class="w-list">
        ${wet.w.rain > 0 ? `<div><span>🌧 Wettest</span><span>${wet.date} · ${ran(wet)}</span><b>${wet.w.rain}mm</b></div>` : ''}
        <div><span>🥶 Coldest start</span><span>${cold.date} · ${ran(cold)}</span><b>${cold.w.temp}°C</b></div>
        <div><span>💨 Windiest</span><span>${windy.date} · ${ran(windy)}</span><b>${Math.round(windy.w.wind)} km/h</b></div>
      </div>
      <div class="w-text">All measured 9–10am, while you were out there.</div>`);
  }

  const crossed = P.filter(p => p.crossed.length);
  out.push(`<div class="w-eyebrow">Milestones</div>
    ${crossed.length ? `<div class="w-mid">${crossed.map(p => `${p.short}: ${p.crossed.join(' & ')}`).join('<br>')}</div><div class="w-text">New shirt${crossed.length > 1 ? 's' : ''} earned this year.</div>`
                     : `<div class="w-mid">Building up</div><div class="w-text">No new shirts this year, but every run counts towards the next.</div>`}
    <div class="w-row">${P.map(p => { const n = CLUBS.find(c => c > p.endTotal), eta = n && soFar ? milestoneEta(p.runner, n) : null;
      return `<div class="w-tile">${who(p)}<div class="w-mid">${p.endTotal}</div><div class="w-sub">${n ? `${n - p.endTotal} to the ${n} shirt${eta ? `, around ${fmtMonth(eta)}` : ''}` : 'all shirts earned'}</div></div>`; }).join('')}</div>
    <div class="w-text" style="margin-top:22px">See you Saturday 👋</div>`);
  return out;
}

function showSlide(i) {
  W.i = Math.max(0, Math.min(W.slides.length - 1, i));
  const card = document.getElementById('wCard');
  card.innerHTML = W.slides[W.i];
  card.classList.remove('w-enter'); void card.offsetWidth; card.classList.add('w-enter');
  document.getElementById('wBars').innerHTML = W.slides.map((_, k) => `<i class="${k <= W.i ? 'on' : ''}"></i>`).join('');
  document.getElementById('wCount').textContent = `${W.i + 1} / ${W.slides.length}`;
  document.getElementById('wPrev').disabled = W.i === 0;
  document.getElementById('wNext').textContent = W.i === W.slides.length - 1 ? 'Done' : 'Next ›';
  card.querySelectorAll('[data-year]').forEach(b => b.onclick = e => { e.stopPropagation(); openWrapped(+b.dataset.year); });
}
function openWrapped(Y, opener) {
  W.year = Y; W.slides = buildSlides(yearStats(Y));
  const el = document.getElementById('wrapped');
  if (el.hidden) { W.opener = opener || document.activeElement; el.hidden = false; document.body.classList.add('w-open'); }
  showSlide(0);
  document.getElementById('wClose').focus();
}
function closeWrapped() {
  document.getElementById('wrapped').hidden = true;
  document.body.classList.remove('w-open');
  if (W.opener && W.opener.focus) W.opener.focus();
}
document.getElementById('wClose').onclick = closeWrapped;
document.getElementById('wPrev').onclick = () => showSlide(W.i - 1);
document.getElementById('wNext').onclick = () => W.i === W.slides.length - 1 ? closeWrapped() : showSlide(W.i + 1);
// tap the left third to go back, anywhere else to go on
document.getElementById('wStage').onclick = e => {
  const r = e.currentTarget.getBoundingClientRect();
  if (e.clientX - r.left < r.width / 3) showSlide(W.i - 1);
  else if (W.i < W.slides.length - 1) showSlide(W.i + 1);
};
document.addEventListener('keydown', e => {
  if (document.getElementById('wrapped').hidden) return;
  if (e.key === 'Escape') closeWrapped();
  else if (e.key === 'ArrowRight') showSlide(W.i + 1);
  else if (e.key === 'ArrowLeft') showSlide(W.i - 1);
});

// Theme toggle: Auto → Light → Dark → Auto. Canvas colours are baked in at
// draw time, so any change has to redraw the active view.
const THEMES = [
  { mode: 'system', icon: '◐',  label: 'Auto',  title: 'Theme: following your device' },
  { mode: 'light',  icon: '☀️', label: 'Light', title: 'Theme: always light' },
  { mode: 'dark',   icon: '🌙', label: 'Dark',  title: 'Theme: always dark' },
];
const prefersDark = matchMedia('(prefers-color-scheme: dark)');
const themeBtn = document.getElementById('themeBtn');
let themeMode = window.__themeMode || 'system';

function applyTheme(redraw) {
  const dark = themeMode === 'dark' || (themeMode === 'system' && prefersDark.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const t = THEMES.find(x => x.mode === themeMode);
  themeBtn.innerHTML = `<span class="ti">${t.icon}</span><span class="tl"> ${t.label}</span>`;
  themeBtn.title = t.title;
  themeBtn.setAttribute('aria-label', t.title);
  syncTheme();
  if (redraw) { if (activeRunner === 'vs') renderH2H(); else render(); }
}
themeBtn.onclick = () => {
  themeMode = THEMES[(THEMES.findIndex(x => x.mode === themeMode) + 1) % THEMES.length].mode;
  try { localStorage.setItem('theme', themeMode); } catch (e) {}
  applyTheme(true);
};
prefersDark.addEventListener('change', () => { if (themeMode === 'system') applyTheme(true); });

applyTheme(false);
render();
</script>
</body>
</html>
